name: Secret Scan

# Extracted from axon-main's zero-knowledge telemetry ban + AKIA/PEM patterns.
# Call from a repo's ci chain or as a standalone job on PRs.

on:
  workflow_call:
    inputs:
      runs-on:
        description: Runner label for the build/test jobs, e.g. ubuntu-latest or a self-hosted label.
        required: false
        type: string
        default: ubuntu-latest
      banned-packages:
        description: Pipe-separated regex of banned package names (checked in csproj/package.json/pyproject).
        required: false
        type: string
        default: "ApplicationInsights|Sentry|Segment|Mixpanel|Datadog|NewRelic|Raygun|Rollbar|Bugsnag|HockeyApp|AppCenter|GoogleAnalytics"
      paths:
        description: Space-separated paths to scan for secret-shaped strings.
        required: false
        type: string
        default: "src"
      strict-packages:
        description: Fail on banned package match.
        required: false
        type: boolean
        default: true

jobs:
  scan:
    runs-on: ${{ inputs.runs-on }}
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0 }

      - name: Banned-package scan
        shell: bash
        env:
          BANNED: ${{ inputs.banned-packages }}
          STRICT: ${{ inputs.strict-packages }}
        run: |
          ERR=$(mktemp)
          # Every tracked manifest, at any depth. A bare 'package.json' pathspec names the root file only, so a
          # monorepo's apps/*/package.json was never read; ':(glob)**/' reaches all of them.
          # git grep exits 0 on a match, 1 on no match, anything else on an error, and an error fails the job.
          HITS=$(git grep -lIiE "$BANNED" -- ':(glob)**/*.csproj' ':(glob)**/package.json' ':(glob)**/pyproject.toml' ':(glob)**/requirements*.txt' 2>"$ERR") && RC=0 || RC=$?
          case "$RC" in
            0)
              while IFS= read -r FILE; do echo "::error::Banned package match in: $FILE"; done <<< "$HITS"
              if [ "$STRICT" = "true" ]; then exit 1; fi
              ;;
            1)
              echo "No banned packages in any tracked manifest."
              ;;
            *)
              echo "::error::git grep failed (exit $RC); the banned-package scan did not run."
              cat "$ERR"
              exit 1
              ;;
          esac

      - name: Secret-shape scan
        shell: bash
        env:
          SCAN_PATHS: ${{ inputs.paths }}
        run: |
          PATTERNS='InstrumentationKey=|https://[a-f0-9]+@[a-z0-9]+\.ingest\.sentry\.io|AKIA[0-9A-Z]{16}|ASIA[0-9A-Z]{16}|xoxb-[0-9]+-[0-9]+-[a-zA-Z0-9]+|sk_live_[0-9a-zA-Z]+|sk-ant-[0-9a-zA-Z_-]+|ghp_[0-9a-zA-Z]{36,}|-----BEGIN ((RSA|OPENSSH|EC|PGP) )?PRIVATE KEY-----'
          read -ra SCAN <<< "$SCAN_PATHS"
          ERR=$(mktemp)
          # Paths go after `--`: before it git reads them as revisions, fails, and the scan used to pass silently.
          # git grep exits 0 on a match, 1 on no match, anything else on an error.
          # Consumers that carry their own scanner (scripts/scan-secrets.ps1) list these same patterns as literals;
          # exclude any *scan-secrets* file so the scanner never flags its own pattern table.
          HITS=$(git grep -nIE "$PATTERNS" -- "${SCAN[@]}" ':(exclude).env.example' ':(exclude)docs/**' ':(exclude).claude/**' ':(exclude).agents/**' ':(exclude)skills/**' ':(exclude)*scan-secrets*' 2>"$ERR") && RC=0 || RC=$?
          case "$RC" in
            0)
              echo "::error::Possible secret committed:"
              echo "$HITS"
              exit 1
              ;;
            1)
              echo "No secret-shaped strings found in: ${SCAN[*]}"
              ;;
            *)
              echo "::error::git grep failed (exit $RC); the secret scan did not run."
              cat "$ERR"
              exit 1
              ;;
          esac
