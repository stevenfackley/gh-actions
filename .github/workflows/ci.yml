name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  actionlint:
    name: Lint workflows
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Run actionlint
        uses: docker://rhysd/actionlint:1.7.7
        with:
          args: -color

  pattern-parity:
    name: Secret-shape lists match
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: One pattern list in four workflows
        shell: bash
        run: |
          # secret-scan.yml, ci-dotnet.yml, ci-node.yml and ci-python.yml each carry the list. A shape added
          # to one of them and not the others is a hole nobody sees. Consumers' scripts/scan-secrets.ps1
          # carries the same list and the same leave-outs; change them together.
          # Anchored to the start of the line, so the greps in this file do not count themselves.
          ASSIGN="^[[:space:]]*PATTERNS='"
          FILES=$(grep -l "$ASSIGN" .github/workflows/*.yml | wc -l)
          LISTS=$(grep -h "$ASSIGN" .github/workflows/*.yml | sed 's/^[[:space:]]*//' | sort -u | wc -l)
          if [ "$FILES" -ne 4 ] || [ "$LISTS" -ne 1 ]; then
            echo "::error::Expected one secret-shape list in four workflows; found $LISTS distinct list(s) in $FILES file(s)."
            grep -n "$ASSIGN" .github/workflows/*.yml
            exit 1
          fi
          # The leave-outs must match too: a file one workflow skips and another reads is the same kind of hole.
          SKIPS=$(grep -l "$ASSIGN" .github/workflows/*.yml | while IFS= read -r F; do grep -o "':(exclude)[^']*'" "$F" | sort -u | tr '\n' ' '; echo; done | sort -u | wc -l)
          if [ "$SKIPS" -ne 1 ]; then
            echo "::error::The four workflows do not leave out the same files:"
            grep -l "$ASSIGN" .github/workflows/*.yml | while IFS= read -r F; do echo "$F: $(grep -o "':(exclude)[^']*'" "$F" | sort -u | tr '\n' ' ')"; done
            exit 1
          fi
          echo "One list and one set of leave-outs, four workflows."
