name: CI (Python)

on:
  workflow_call:
    inputs:
      runs-on:
        description: Runner label for the build/test jobs, e.g. ubuntu-latest or a self-hosted label.
        required: false
        type: string
        default: ubuntu-latest
      project-name:
        required: true
        type: string
      python-version:
        required: false
        type: string
        default: "3.11"
      run-postgres:
        required: false
        type: boolean
        default: false
      postgres-image:
        description: Postgres service image (e.g. postgis/postgis:16-3.4). Only used when run-postgres is true.
        required: false
        type: string
        default: "postgres:16"
      system-packages:
        description: apt-get packages to install (space-separated).
        required: false
        type: string
        default: ""
      pytest-args:
        required: false
        type: string
        default: ""

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  lint-test:
    name: Lint & Test
    runs-on: ${{ inputs.runs-on }}
    services:
      postgres:
        image: ${{ inputs.run-postgres && inputs.postgres-image || '' }}
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v7

      - name: Secret-shape grep
        shell: bash
        run: |
          # The same shapes as secret-scan.yml, ci-dotnet.yml and ci-node.yml. This repo's own ci.yml fails
          # when the four PATTERNS lines differ.
          PATTERNS='InstrumentationKey=|https://[a-f0-9]+@[a-z0-9]+\.ingest\.sentry\.io|AKIA[0-9A-Z]{16}|ASIA[0-9A-Z]{16}|xoxb-[0-9]+-[0-9]+-[a-zA-Z0-9]+|sk_live_[0-9a-zA-Z]+|sk-ant-[0-9a-zA-Z_-]+|ghp_[0-9a-zA-Z]{36,}|-----BEGIN ([A-Z0-9]+ )*PRIVATE KEY( BLOCK)?-----'
          ERR=$(mktemp)
          # git grep exits 0 on a match, 1 on no match, anything else on an error, and an error fails the job.
          HITS=$(git grep -nIE "$PATTERNS" -- ':(exclude).env.example' ':(exclude)docs/**' ':(exclude).claude/**' ':(exclude).agents/**' ':(exclude)skills/**' ':(exclude)*scan-secrets*' 2>"$ERR") && RC=0 || RC=$?
          case "$RC" in
            0)
              echo "::error::Possible secret committed:"
              echo "$HITS"
              exit 1
              ;;
            1)
              echo "No secret-shaped strings found."
              ;;
            *)
              echo "::error::git grep failed (exit $RC); the secret scan did not run."
              cat "$ERR"
              exit 1
              ;;
          esac

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ inputs.python-version }}

      - name: Install uv
        run: pip install --upgrade uv

      - name: Install system packages
        if: inputs.system-packages != ''
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ${{ inputs.system-packages }}

      - name: Install project deps
        run: |
          if [ -f pyproject.toml ]; then
            uv pip install --system -e ".[dev]" 2>/dev/null || uv pip install --system -e "."
            uv pip install --system pytest pytest-asyncio ruff httpx
          elif [ -f requirements-test.txt ]; then
            uv pip install --system -r requirements-test.txt
          elif [ -f requirements.txt ]; then
            uv pip install --system -r requirements.txt
            uv pip install --system pytest ruff
          else
            echo "::error::No pyproject.toml / requirements*.txt found." && exit 1
          fi

      - name: Lint (ruff)
        run: ruff check .

      - name: Test (pytest)
        run: pytest ${{ inputs.pytest-args }}
        env:
          DATABASE_URL: "postgresql://test:test@localhost:5432/test_db"
          OPENAI_API_KEY: test-key
          ANTHROPIC_API_KEY: test-key
